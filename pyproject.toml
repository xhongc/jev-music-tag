[project]
name = "jev-music-tag"
version = "0.1.0"
description = "Minimal FastAPI + React workbench for Jev-powered music metadata decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
dev-dependencies = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
